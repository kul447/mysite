<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Site</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #08080f;
      --surface: #111120;
      --border:  rgba(255,255,255,0.07);
      --accent:  #c8f04b;
      --accent2: #7b61ff;
      --text:    #eeeef0;
      --muted:   rgba(238,238,240,0.42);
      --ff:      'Syne', sans-serif;
      --fm:      'DM Mono', monospace;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--fm);
      font-weight: 300;
      overflow-x: hidden;
    }

    /* ── canvas bg ── */
    #bg-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* ── noise overlay ── */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
      opacity: 0.6;
    }

    /* ── everything on top of canvas ── */
    nav, main, footer { position: relative; z-index: 10; }

    /* ── nav ── */
    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.4rem 6%;
      border-bottom: 1px solid var(--border);
      background: rgba(8,8,15,0.6);
      backdrop-filter: blur(16px);
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
    }
    .logo {
      font-family: var(--ff);
      font-weight: 800;
      font-size: 1.2rem;
      letter-spacing: -0.03em;
      color: var(--accent);
    }
    nav ul { display: flex; gap: 2rem; list-style: none; }
    nav a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.8rem;
      letter-spacing: 0.06em;
      transition: color 0.2s;
    }
    nav a:hover { color: var(--text); }

    /* ── sections ── */
    main { padding-top: 80px; }

    section {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 6rem 8%;
    }

    /* ── hero ── */
    #hero { text-align: left; }

    .hero-eyebrow {
      font-size: 0.75rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 1.2rem;
      opacity: 0;
      animation: fadeUp 0.6s 0.1s forwards;
    }

    #hero h1 {
      font-family: var(--ff);
      font-size: clamp(3rem, 9vw, 7rem);
      font-weight: 800;
      line-height: 1.0;
      letter-spacing: -0.04em;
      margin-bottom: 1.4rem;
      opacity: 0;
      animation: fadeUp 0.7s 0.25s forwards;
    }

    #hero-tagline {
      font-size: clamp(1rem, 2vw, 1.2rem);
      color: var(--muted);
      max-width: 540px;
      line-height: 1.85;
      margin-bottom: 2.5rem;
      opacity: 0;
      animation: fadeUp 0.7s 0.4s forwards;
    }

    .hero-links {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      opacity: 0;
      animation: fadeUp 0.7s 0.55s forwards;
    }
    .hero-links a {
      border: 1px solid var(--border);
      color: var(--muted);
      text-decoration: none;
      padding: 0.6rem 1.3rem;
      border-radius: 100px;
      font-size: 0.82rem;
      letter-spacing: 0.04em;
      transition: all 0.2s;
    }
    .hero-links a:hover { border-color: var(--accent); color: var(--accent); }

    /* ── section labels ── */
    .s-label {
      font-size: 0.7rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.8rem;
    }
    .s-title {
      font-family: var(--ff);
      font-size: clamp(1.8rem, 4vw, 3rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.1;
      margin-bottom: 3rem;
    }

    /* ── about ── */
    #about { border-top: 1px solid var(--border); }
    #about-text {
      font-size: 1.05rem;
      color: var(--muted);
      max-width: 640px;
      line-height: 2;
    }

    /* ── skills ── */
    #skills { border-top: 1px solid var(--border); }
    #skills-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
    }
    .skill-tag {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.45rem 1.1rem;
      border-radius: 100px;
      font-size: 0.82rem;
      letter-spacing: 0.04em;
      transition: border-color 0.2s, color 0.2s;
    }
    .skill-tag:hover { border-color: var(--accent); color: var(--accent); }

    /* ── projects ── */
    #projects { border-top: 1px solid var(--border); }
    #projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5px;
      background: var(--border);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }
    .proj-card {
      background: var(--surface);
      padding: 2rem;
      transition: background 0.25s;
      text-decoration: none;
      color: inherit;
      display: block;
    }
    .proj-card:hover { background: #1a1a2e; }
    .proj-title {
      font-family: var(--ff);
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 0.6rem;
      letter-spacing: -0.02em;
    }
    .proj-desc {
      font-size: 0.85rem;
      color: var(--muted);
      line-height: 1.75;
      margin-bottom: 1.2rem;
    }
    .proj-tech {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }
    .proj-tech span {
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      background: rgba(200,240,75,0.08);
      border: 1px solid rgba(200,240,75,0.2);
      color: var(--accent);
      padding: 0.2rem 0.6rem;
      border-radius: 4px;
    }

    /* ── contact ── */
    #contact {
      border-top: 1px solid var(--border);
      text-align: center;
      align-items: center;
    }
    #contact h2 {
      font-family: var(--ff);
      font-size: clamp(2rem, 5vw, 4rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      margin-bottom: 1rem;
    }
    #contact p { color: var(--muted); font-size: 0.95rem; margin-bottom: 2rem; }
    #contact a {
      display: inline-block;
      background: var(--accent);
      color: #0a0a0f;
      padding: 0.9rem 2.2rem;
      border-radius: 100px;
      font-size: 0.9rem;
      font-family: var(--ff);
      font-weight: 700;
      text-decoration: none;
      transition: opacity 0.2s, transform 0.2s;
    }
    #contact a:hover { opacity: 0.85; transform: translateY(-2px); }

    /* ── footer ── */
    footer {
      border-top: 1px solid var(--border);
      padding: 2rem 8%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }
    footer p { font-size: 0.78rem; color: var(--muted); }

    /* ── floating message toast ── */
    #toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.8rem;
      padding: 0.7rem 1.2rem;
      border-radius: 100px;
      z-index: 200;
      opacity: 0;
      transition: opacity 0.4s;
      pointer-events: none;
    }

    /* ── animations ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .reveal {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    .reveal.visible { opacity: 1; transform: none; }

    @media (max-width: 600px) {
      nav ul { display: none; }
      section { padding: 4rem 6%; }
    }
  </style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<nav>
  <div class="logo" id="nav-logo">~/me</div>
  <ul>
    <li><a href="#about">About</a></li>
    <li><a href="#skills">Skills</a></li>
    <li><a href="#projects">Projects</a></li>
    <li><a href="#contact">Contact</a></li>
  </ul>
</nav>

<main>
  <!-- HERO -->
  <section id="hero">
    <p class="hero-eyebrow">Hello, world —</p>
    <h1 id="hero-name">Loading...</h1>
    <p id="hero-tagline"></p>
    <div class="hero-links" id="hero-links"></div>
  </section>

  <!-- ABOUT -->
  <section id="about">
    <p class="s-label reveal">About me</p>
    <h2 class="s-title reveal">Who am I?</h2>
    <p id="about-text" class="reveal"></p>
  </section>

  <!-- SKILLS -->
  <section id="skills">
    <p class="s-label reveal">What I know</p>
    <h2 class="s-title reveal">Skills</h2>
    <div id="skills-list" class="reveal"></div>
  </section>

  <!-- PROJECTS -->
  <section id="projects">
    <p class="s-label reveal">What I built</p>
    <h2 class="s-title reveal">Projects</h2>
    <div id="projects-grid"></div>
  </section>

  <!-- CONTACT -->
  <section id="contact">
    <p class="s-label reveal">Get in touch</p>
    <h2 class="reveal">Let's talk.</h2>
    <p class="reveal" style="margin-bottom:2.5rem;">I'm always down to collaborate, chat, or just vibe.</p>

    <form id="contact-form" class="reveal" style="width:100%;max-width:520px;">
      <div style="display:flex;flex-direction:column;gap:1rem;">
        <input
          type="text" id="cf-name" placeholder="Your name"
          style="background:var(--surface);border:1px solid var(--border);color:var(--text);padding:0.85rem 1.2rem;border-radius:10px;font-family:var(--fm);font-size:0.9rem;outline:none;transition:border-color 0.2s;"
          onfocus="this.style.borderColor='var(--accent)'" onblur="this.style.borderColor='var(--border)'"
        />
        <input
          type="email" id="cf-email" placeholder="Your email"
          style="background:var(--surface);border:1px solid var(--border);color:var(--text);padding:0.85rem 1.2rem;border-radius:10px;font-family:var(--fm);font-size:0.9rem;outline:none;transition:border-color 0.2s;"
          onfocus="this.style.borderColor='var(--accent)'" onblur="this.style.borderColor='var(--border)'"
        />
        <textarea
          id="cf-message" placeholder="Your message" rows="5"
          style="background:var(--surface);border:1px solid var(--border);color:var(--text);padding:0.85rem 1.2rem;border-radius:10px;font-family:var(--fm);font-size:0.9rem;outline:none;resize:vertical;transition:border-color 0.2s;"
          onfocus="this.style.borderColor='var(--accent)'" onblur="this.style.borderColor='var(--border)'"
        ></textarea>
        <button
          type="button" id="cf-submit"
          onclick="sendMessage()"
          style="background:var(--accent);color:#0a0a0f;border:none;padding:0.9rem 2rem;border-radius:100px;font-family:var(--ff);font-size:0.95rem;font-weight:700;cursor:pointer;transition:opacity 0.2s,transform 0.2s;align-self:flex-start;"
          onmouseover="this.style.opacity='0.85'" onmouseout="this.style.opacity='1'"
        >Send message →</button>
        <p id="cf-status" style="font-size:0.85rem;min-height:1.2rem;"></p>
      </div>
    </form>
  </section>
</main>

<footer>
  <p id="footer-name"></p>
  <p>Built with Node.js + Express + antigravity ✦</p>
</footer>

<div id="toast"></div>

<script>
// ═══════════════════════════════════════════════
//  ANTIGRAVITY BACKGROUND CANVAS
// ═══════════════════════════════════════════════
const canvas = document.getElementById('bg-canvas');
const ctx    = canvas.getContext('2d');

function resizeCanvas() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

const COLORS  = ['#c8f04b','#7b61ff','#4bc8f0','#ff6b9d','#f0a84b'];
const SHAPES  = ['circle','triangle','diamond','star'];
let   objects = [];

function rand(a, b) { return a + Math.random() * (b - a); }
function pick(arr)  { return arr[Math.floor(Math.random() * arr.length)]; }

function makeObj() {
  return {
    x:  rand(0, canvas.width),
    y:  rand(canvas.height * 0.3, canvas.height),
    vx: rand(-0.6, 0.6),
    vy: rand(-0.8, -0.2),
    size:  rand(8, 22),
    color: pick(COLORS),
    shape: pick(SHAPES),
    alpha: rand(0.15, 0.45),
    rot:   rand(0, Math.PI * 2),
    rotV:  rand(-0.012, 0.012),
    wobble: rand(0, Math.PI * 2),
    wobbleS: rand(0.01, 0.04),
    wobbleA: rand(0.15, 0.5),
  };
}

for (let i = 0; i < 55; i++) objects.push(makeObj());

function drawShape(o) {
  ctx.save();
  ctx.globalAlpha = o.alpha;
  ctx.translate(o.x, o.y);
  ctx.rotate(o.rot);
  ctx.strokeStyle = o.color;
  ctx.lineWidth = 1.2;
  ctx.fillStyle = o.color + '22';
  const s = o.size;
  ctx.beginPath();
  if (o.shape === 'circle') {
    ctx.arc(0, 0, s, 0, Math.PI * 2);
  } else if (o.shape === 'triangle') {
    ctx.moveTo(0, -s);
    ctx.lineTo(s * 0.87, s * 0.5);
    ctx.lineTo(-s * 0.87, s * 0.5);
    ctx.closePath();
  } else if (o.shape === 'diamond') {
    ctx.moveTo(0, -s); ctx.lineTo(s*0.6, 0);
    ctx.lineTo(0, s);  ctx.lineTo(-s*0.6, 0);
    ctx.closePath();
  } else {
    for (let i = 0; i < 10; i++) {
      const a = (Math.PI / 5) * i - Math.PI / 2;
      const r = i % 2 === 0 ? s : s * 0.42;
      i === 0 ? ctx.moveTo(Math.cos(a)*r, Math.sin(a)*r)
              : ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r);
    }
    ctx.closePath();
  }
  ctx.fill();
  ctx.stroke();
  ctx.restore();
}

function animateBg() {
  requestAnimationFrame(animateBg);
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (const o of objects) {
    o.wobble += o.wobbleS;
    o.vx += Math.sin(o.wobble) * o.wobbleA * 0.01;
    o.vy -= 0.008;
    o.x  += o.vx;
    o.y  += o.vy;
    o.rot += o.rotV;

    if (o.x < -40)              o.x = canvas.width + 40;
    if (o.x > canvas.width + 40) o.x = -40;
    if (o.y < -40) {
      o.y  = canvas.height + 40;
      o.vx = rand(-0.6, 0.6);
      o.vy = rand(-0.8, -0.2);
    }
    drawShape(o);
  }
}
animateBg();

// mouse repel
window.addEventListener('mousemove', e => {
  for (const o of objects) {
    const dx = o.x - e.clientX;
    const dy = o.y - e.clientY;
    const d  = Math.sqrt(dx*dx + dy*dy);
    if (d < 100) {
      o.vx += (dx / d) * 0.4;
      o.vy += (dy / d) * 0.4;
    }
  }
});

// ═══════════════════════════════════════════════
//  FETCH PROFILE FROM BACKEND
// ═══════════════════════════════════════════════
async function loadProfile() {
  try {
    const res  = await fetch('/api/profile');
    const data = await res.json();

    // nav logo
    document.getElementById('nav-logo').textContent = `~/${data.name.split(' ')[0].toLowerCase()}`;

    // hero
    document.getElementById('hero-name').textContent    = data.name;
    document.getElementById('hero-tagline').textContent = data.tagline;

    const linksEl = document.getElementById('hero-links');
    data.links.forEach(l => {
      const a = document.createElement('a');
      a.href = l.url; a.textContent = l.label; a.target = '_blank';
      linksEl.appendChild(a);
    });

    // about
    document.getElementById('about-text').textContent = data.about;

    // skills
    const skillsEl = document.getElementById('skills-list');
    data.skills.forEach(sk => {
      const span = document.createElement('span');
      span.className = 'skill-tag';
      span.textContent = sk;
      skillsEl.appendChild(span);
    });

    // projects
    const grid = document.getElementById('projects-grid');
    data.projects.forEach(p => {
      const a = document.createElement('a');
      a.className = 'proj-card reveal';
      a.href = p.url; a.target = '_blank';
      a.innerHTML = `
        <div class="proj-title">${p.title}</div>
        <p class="proj-desc">${p.desc}</p>
        <div class="proj-tech">${p.tech.map(t => `<span>${t}</span>`).join('')}</div>
      `;
      grid.appendChild(a);
    });

    // contact
    const emailLink = data.links.find(l => l.url.startsWith('mailto:'));
    if (emailLink) document.getElementById('contact-link').href = emailLink.url;

    // footer
    document.getElementById('footer-name').textContent = `© ${new Date().getFullYear()} ${data.name}`;

    // trigger reveal observer after DOM update
    setTimeout(initReveal, 100);

  } catch (err) {
    console.error('Could not load profile:', err);
  }
}

// ═══════════════════════════════════════════════
//  FETCH RANDOM MESSAGE (TOAST)
// ═══════════════════════════════════════════════
async function showToast() {
  try {
    const res  = await fetch('/api/message');
    const data = await res.json();
    const el   = document.getElementById('toast');
    el.textContent = data.message;
    el.style.opacity = '1';
    setTimeout(() => { el.style.opacity = '0'; }, 3500);
  } catch {}
}

setTimeout(showToast, 1800);

// ═══════════════════════════════════════════════
//  SCROLL REVEAL
// ═══════════════════════════════════════════════
function initReveal() {
  const obs = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) e.target.classList.add('visible');
    });
  }, { threshold: 0.12 });

  document.querySelectorAll('.reveal').forEach(el => obs.observe(el));
}
initReveal();

// ═══════════════════════════════════════════════
//  BOOT
// ═══════════════════════════════════════════════
loadProfile();

// ═══════════════════════════════════════════════
//  CONTACT FORM
// ═══════════════════════════════════════════════
async function sendMessage() {
  const name    = document.getElementById('cf-name').value.trim();
  const email   = document.getElementById('cf-email').value.trim();
  const message = document.getElementById('cf-message').value.trim();
  const status  = document.getElementById('cf-status');
  const btn     = document.getElementById('cf-submit');

  if (!name || !email || !message) {
    status.style.color = '#ff6b6b';
    status.textContent = 'Please fill all fields.';
    return;
  }

  btn.textContent = 'Sending...';
  btn.style.opacity = '0.6';
  btn.disabled = true;

  try {
    const res  = await fetch('/api/contact', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ name, email, message }),
    });
    const data = await res.json();

    if (data.success) {
      status.style.color = '#c8f04b';
      status.textContent = 'Message sent successfully!';
      document.getElementById('cf-name').value    = '';
      document.getElementById('cf-email').value   = '';
      document.getElementById('cf-message').value = '';
      btn.textContent = 'Send message →';
    } else {
      status.style.color = '#ff6b6b';
      status.textContent = data.error || 'Something went wrong.';
      btn.textContent = 'Send message →';
    }
  } catch (err) {
    status.style.color = '#ff6b6b';
    status.textContent = 'Network error. Try again.';
    btn.textContent = 'Send message →';
  }

  btn.style.opacity = '1';
  btn.disabled = false;
}
</script>
</body>
</html>
